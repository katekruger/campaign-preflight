[project]
name = "campaign-preflight"
version = "0.1.0"
description = "Read-only preflight checks for outbound email campaigns: contacts, personalization, suppressions, schedules, sender readiness, and configuration. CLI + MCP."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Campaign Preflight contributors" }]
keywords = [
    "gtm-engineering",
    "sales-ops",
    "revenue-operations",
    "campaign-automation",
    "email-automation",
    "instantly-ai",
    "mcp",
    "model-context-protocol",
    "developer-tools",
    "linter",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
    "Typing :: Typed",
]
# No runtime dependencies. Campaign Preflight ships inside a Cowork plugin,
# where the only guaranteed runtime is the system python3 with nothing
# installed alongside it. The CLI, the rule engine, the reporters, and the MCP
# server are all standard library only.
dependencies = []

[project.optional-dependencies]
# Only needed for `campaign-preflight instantly`, which talks to a live API.
instantly = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/katekruger/campaign-preflight"
Repository = "https://github.com/katekruger/campaign-preflight"
Issues = "https://github.com/katekruger/campaign-preflight/issues"
Changelog = "https://github.com/katekruger/campaign-preflight/blob/main/CHANGELOG.md"

[project.scripts]
campaign-preflight = "campaign_preflight.cli:main"
campaign-preflight-mcp = "campaign_preflight.mcp.server:main"

[dependency-groups]
dev = [
    "httpx>=0.27",          # exercises the optional Instantly provider
    "PyYAML>=6.0",          # oracle for the bundled YAML parser's differential tests
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "jsonschema>=4.22",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/campaign_preflight"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]
# plugin/**/engine is a generated copy of src/, produced by
# scripts/build_plugin.py. Linting it would double-report every finding.
extend-exclude = ["plugin/*/engine", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "S"]
ignore = ["S101", "RUF012", "B008"]

[tool.ruff.lint.per-file-ignores]
# Tests use deliberately fake credentials and long fixture literals.
"tests/**/*.py" = ["S", "E501"]
"scripts/*.py" = ["S603", "S607"]
# `pass_summary=` is the wording used when a rule passes, not a credential.
"src/campaign_preflight/rules/contacts.py" = ["S106"]

[tool.mypy]
# mypy dropped support for targeting 3.9; the CI matrix covers the 3.9 runtime
# and ruff's target-version keeps the syntax within the floor.
python_version = "3.10"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
mypy_path = "src"
packages = ["campaign_preflight"]
exclude = ["^plugin/", "^dist/"]

[[tool.mypy.overrides]]
module = ["httpx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:campaign_preflight.*"]

[tool.coverage.run]
source = ["campaign_preflight"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
