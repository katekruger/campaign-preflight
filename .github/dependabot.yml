version: 2

updates:
  # The shipped package has no runtime dependencies; this covers the dev
  # toolchain, which still runs in CI and is worth keeping current.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels: ["dependencies"]
    groups:
      dev-tooling:
        patterns: ["pytest*", "ruff", "mypy", "hypothesis", "jsonschema", "types-*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "github-actions"]
    groups:
      actions:
        patterns: ["*"]
